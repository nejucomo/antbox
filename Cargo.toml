[workspace]
resolver = "3"
members = [
  "anim",
  "antbox",
  "clife",
  "color",
  "float",
  "gameboard",
  "geom",
  "grid",
  "logging-options",
  "moveslot",
  "movestate",
  "render",
  "s2win",
  "tick",
]

[workspace.package]
edition = "2024"
license = "MIT"
homepage = "https://github.com/nejucomo/antbox"

[workspace.dependencies]
antbox = { version = "0.1.0", path = "antbox" }
antbox-animation = { version = "0.1.0", path = "anim" }
antbox-clife = { version = "0.1.0", path = "clife" }
antbox-color = { version = "0.1.0", path = "color" }
antbox-float = { version = "0.1.0", path = "float" }
antbox-gameboard = { version = "0.1.0", path = "gameboard" }
antbox-geom = { version = "0.1.0", path = "geom" }
antbox-grid = { version = "0.1.0", path = "grid" }
antbox-render = { version = "0.1.0", path = "render" }
antbox-s2win = { version = "0.1.0", path = "s2win" }
antbox-tick-timer = { version = "0.1.0", path = "tick" }
logging-options = { version = "0.1.0", path = "logging-options" }
moveslot = { version = "0.1.0", path = "moveslot" }
movestate = { version = "0.1.0", path = "movestate" }

anyhow = "1.0.100"
clap = "4.5.53"
derive-debug = "0.1.2"
derive-new = "0.7.0"
derive_more = "2.0.1"
either = "1.15.0"
env_logger = "0.11.8"
extension-traits = "2.0.1"
itertools = "0.14.0"
log = "0.4.28"
num-integer = "0.1.46"
rand = "0.9.2"
rand_distr = "0.5.1"
speedy2d = "2.1.0"
test-case = "3.3.1"
thiserror = "2.0.17"
wyrand = "0.3.2"
