[workspace]
resolver = "3"
members = [
  "anim",
  "antbox",
  "cellauto",
  "geom",
  "logging-options",
  "mealy",
  "state",
  "tick",
  "trig",
]

[workspace.package]
edition = "2024"
license = "MIT"
homepage = "https://github.com/nejucomo/antbox"

[workspace.dependencies]
antbox = { version = "0.1.0", path = "antbox" }
antbox-animation = { version = "0.1.0", path = "anim" }
antbox-cellauto = { version = "0.1.0", path = "cellauto" }
antbox-geom = { version = "0.1.0", path = "geom" }
antbox-state = { version = "0.1.0", path = "state" }
antbox-tick-timer = { version = "0.1.0", path = "tick" }
antbox-trig = { version = "0.1.0", path = "trig" }
logging-options = { version = "0.1.0", path = "logging-options" }
mealy-machine = { version = "0.1.0", path = "mealy" }

anyhow = "1.0.100"
clap = "4.5.53"
derive-debug = "0.1.2"
derive-new = "0.7.0"
derive_more = "2.0.1"
either = "1.15.0"
env_logger = "0.11.8"
itertools = "0.14.0"
log = "0.4.28"
num-integer = "0.1.46"
rand = "0.9.2"
speedy2d = "2.1.0"
